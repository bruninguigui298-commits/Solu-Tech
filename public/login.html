<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar | Solutech</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login">
<form id="form">
  <div class="brand">Solutech</div>
  <h1>Entre para acessar o painel.</h1>
  <div><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div>
  <div><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required></div>
  <p class="msg" id="msg" role="alert"></p>
  <button class="btn" id="btn">Entrar</button>
</form>
<script src="api.js"></script>
<script src="login.js"></script>
</body>
</html>
